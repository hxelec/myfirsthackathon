/* Pointer-reactive forest glass, including conversation history and chat area. */
html,body { background-color:#0b2118; color:#f2efdf; color-scheme:dark; }
.sidebar { background-color:#0b2118; background-image:radial-gradient(180px circle at var(--mx,-300px) var(--my,-300px),rgba(0,0,0,.68),transparent 100%),linear-gradient(125deg,rgba(112,152,92,.10),rgba(5,22,15,.18)); }
.chat-scroll { background-image:radial-gradient(200px circle at var(--mx,-300px) var(--my,-300px),rgba(0,0,0,.43),transparent 100%); }
.glass:before { background:radial-gradient(160px circle at var(--mx,50%) var(--my,50%),rgba(0,0,0,.70),transparent 100%); }
.mouse-active .context-cursor { display:flex; }
.context-cursor i { width:10px; height:10px; box-shadow:0 0 0 1px rgba(0,0,0,.16); }
.chart-card, dialog { color-scheme:light; }
@media(prefers-reduced-motion:reduce) { .context-cursor { transition:none; } }

/* One compact spotlight across the viewport: no per-panel clipping. */
.sidebar{background-image:linear-gradient(125deg,rgba(112,152,92,.10),rgba(5,22,15,.18))}
.chat-scroll{background-image:none}
.glass:before{display:none}
#pointer-spotlight{position:fixed;z-index:95;width:230px;height:230px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(circle,rgba(0,0,0,.39) 0,rgba(0,0,0,.29) 18%,rgba(0,0,0,.12) 44%,transparent 71%);opacity:0;transition:opacity .15s;mix-blend-mode:multiply}
.context-cursor[data-mode=chart] span{max-width:290px;white-space:pre-line;font-size:11px;line-height:1.6;padding:8px 11px}
.context-cursor[data-mode=chart] span:first-line{font-weight:700;color:#d8ecb5}
.chart-card+.chart-card{margin-top:28px}
.data-mark{cursor:crosshair;transition:filter .12s}
.data-mark:hover,.data-mark:focus{filter:brightness(1.3);outline:none}
.chart-svg text{font-family:var(--sans)}
@media(pointer:coarse){#pointer-spotlight{display:none}.mouse-active #pointer-spotlight{display:block}}

/* Material-local glass returns; the highlight contracts and fades on exit. */
#pointer-spotlight{display:none!important}
.sidebar{background-image:radial-gradient(circle var(--light-radius,0px) at var(--light-x,-300px) var(--light-y,-300px),rgba(0,0,0,var(--light-alpha,0)),transparent 100%),linear-gradient(125deg,rgba(112,152,92,.10),rgba(5,22,15,.18))}
.chat-scroll{background-image:radial-gradient(circle var(--light-radius,0px) at var(--light-x,-300px) var(--light-y,-300px),rgba(0,0,0,var(--light-alpha,0)),transparent 100%);background-attachment:local}
.composer.glass:before{display:block;opacity:1;background:radial-gradient(circle var(--light-radius,0px) at var(--light-x,-300px) var(--light-y,-300px),rgba(0,0,0,var(--light-alpha,0)),transparent 100%);transition:none}
.history{position:relative}
.history-item i{opacity:0}
.chat-marker{position:absolute;left:12px;top:20px;width:9px;height:9px;background:var(--lime);border-radius:1px;transform:rotate(-12deg);pointer-events:none;box-shadow:0 1px 5px #bce45718;transition:top .46s cubic-bezier(.22,1.25,.38,1),opacity .2s}
.chat-marker.jaunty{animation:marker-jaunt .55s cubic-bezier(.2,.8,.2,1)}
@keyframes marker-jaunt{0%{transform:rotate(-12deg) scale(1)}35%{transform:rotate(48deg) scale(1.17,.85)}70%{transform:rotate(-23deg) scale(.94,1.06)}100%{transform:rotate(-12deg) scale(1)}}
.idea{transition:transform .28s cubic-bezier(.2,.85,.25,1.12),box-shadow .18s,background .18s}
.idea.dragging:not(.snapped){transition:box-shadow .18s,background .18s}
.idea.dragging.snapped,.idea.settling{transition:transform .36s cubic-bezier(.2,.9,.25,1.12),box-shadow .2s}
.idea.snapped{border-color:#d8e4bd85}
.idea-handle{font-size:0}.idea-handle:before{content:'⠿';font:20px var(--sans)}
@media(prefers-reduced-motion:reduce){.chat-marker{animation:none!important;transition:none!important}.idea{transition:none!important}}

.watermark.logo-reflection{opacity:0;color:transparent;filter:drop-shadow(0 0 9px #b8e77c30);pointer-events:none;will-change:opacity}

/* Collapsible sidebar (desktop) and suggestion ideas. */
.sidebar-toggle{position:absolute;top:14px;right:12px;color:var(--muted);font:18px/1 var(--sans)}
.sidebar-toggle:hover{color:var(--ink);background:rgba(125,167,111,.14)}
@media(min-width:761px){
 .sidebar{transition:transform .22s ease,visibility 0s}
 .main{transition:margin-left .22s ease}
 body.sidebar-collapsed .sidebar{transform:translateX(-100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
 body.sidebar-collapsed .main{margin-left:0}
 body.sidebar-collapsed .mobile-menu{display:grid;position:fixed;top:14px;left:14px;z-index:30;color:var(--ink);background:#123224;border:1px solid var(--line)}
}
.ideas-toggle{position:absolute;top:-16px;right:36px;z-index:13;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:#0f2a1ccc;color:var(--muted);font:11px/1.5 var(--sans);letter-spacing:.01em}
.ideas-toggle:hover,.ideas-toggle:focus-visible{color:var(--ink);border-color:#d1e3bb55}
.composer-area.ideas-collapsed .ideas{display:none}
.composer-area.ideas-collapsed{padding-top:22px}
@media(max-width:760px){.ideas-toggle{right:16px;top:-14px}}

/* Chats, projects, menus and attachments. */
.sidebar{overflow:hidden}
.new-chat{margin-top:12px}
.side-search{margin-top:14px}
.side-search input{width:100%;background:#c7dfad10;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:14px/1.3 var(--sans);outline:none}
.side-search input:focus{border-color:#c6e65b88}
.side-search input::placeholder{color:#93a58e}
.history{margin-top:12px;display:block;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#47613f55 transparent;padding:2px 2px 12px}
.history-list{display:block}
.side-section{border-radius:10px;padding:2px 0}

async function submit(text) {
  text = String(text || '').trim();
  if (busy || (!text && !pending.length)) return;
  if (aiAvailable === false) { toast('The AI coach needs a Claude API key in Site settings.'); return; }
  const files = pending.map(({id,name,size,cat,thumb}) => ({id,name,size,cat,thumb}));
  pending = []; renderTray();
  if (!text) text = files.length === 1 ? `Please analyse ${files[0].name}.` : `Please analyse these ${files.length} files.`;
  ensureChat(text);
  $('.welcome')?.remove();
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text, null, true, files.length ? files : undefined);
  await requestReply();
}
async function requestReply() {
  const chat = activeChat();
  if (!chat || busy) return;
  if (aiAvailable === false) { toast('The AI coach needs a Claude API key in Site settings.'); return; }
  const controller = new AbortController();
  activeRequest = controller;
  busy = true;
  $('.send').setAttribute('aria-label','Stop response');
  $('.send').innerHTML = '<span aria-hidden="true">■</span>';
  const row = addMessage('assistant','',null,false);
  $('.message-body',row).innerHTML = '<div class="thinking" aria-label="Preparing reply"><b></b><b></b><b></b></div>';
  scrollBottom();
  try {
    let reply;
    {
      const history = await buildHistory(chat);
      if (activeRequest !== controller) return;
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        signal: controller.signal,
        body: JSON.stringify({messages:history})
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || (response.status === 413 ? 'Those files are too large to send together. Try fewer or smaller files.' : 'Claude could not reply. Try again.'));
      reply = result;
      if (Array.isArray(result.programs)) setPlans(result.programs);
      for (const id of result.changed || []) { const p = plans.find(x => x.id === id); if (p) toast(`Saved “${p.name}”`, {label: 'Open', run: () => { location.href = `/#program=${p.id}`; }}); }
    }
    if (activeRequest !== controller) return;
    row.remove();
    addMessage('assistant',reply.text,reply.kind);
    setIdeas(reply.ideas || standardIdeas);
  } catch (error) {
    if (activeRequest !== controller) return;
    row.remove();
    addRetry(addMessage('assistant',error.name==='TypeError'?'Could not reach RepSNS. Check your connection and try again.':(error.message || 'Claude could not reply. Try again.'),null,false));
  } finally {
    if (activeRequest === controller) {
      activeRequest = null;
      finishBusy();
      scrollBottom();
    }
  }
}
function finishBusy(){busy=false;$('.send').setAttribute('aria-label','Send message');$('.send').innerHTML=icon('arrow');}
function stop(){
  if(!busy)return;
  activeRequest?.abort();
  activeRequest = null;
  $('.thinking')?.closest('.message').remove();
  finishBusy();
  toast('Response stopped');
}

// Weekly rep totals, grouped by calendar week (Mon start) from each session's day and date.
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WEEKDAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

 for(const d of sessions){
  const [dayNum,mon]=String(d.date).split(' '),m=MONTHS.indexOf(mon),wd=WEEKDAYS.indexOf(d.day);
  if(m<0||wd<0||!(+dayNum>0))return null;

 return {last,current,diff,pct:last?diff/last*100:null};
}

 const rising=data.every((d,i)=>!i||d.reps>data[i-1].reps);
 if(metric==='reps'){
  const trend=first.reps===last.reps?`Level at ${last.reps} reps`:`${last.reps>first.reps?'Up':'Down'} from ${first.reps} to ${last.reps} reps`;

 }

  const detail=weekly?`<small class="tip-week">${weeklyParts(weekly).map(t=>`<span>${t}</span>`).join(' · ')}</small>`:`<small>${spec.type==='donut'?(d.reps/total*100).toFixed(1)+'% of repetitions':d.reps+' repetitions at '+d.load+' kg'}</small>`;
  tip.innerHTML=`<strong>${escapeHTML(d.date)} · ${values[i]} ${spec.unit}</strong>${detail}`;tip.hidden=false;tip.classList.remove('below');
  const tw=tip.offsetWidth,th=tip.offsetHeight;let cx,top;
  if(spec.type==='donut'){cx=r.width*.5;top=r.height*.4-th-8;}
  else{const pointY=y(values[i])/H*r.height;cx=px(i)/W*r.width;top=pointY-14-th;if(top<4){tip.classList.add('below');top=pointY+14;}}
  tip.style.left=Math.round(Math.max(4,Math.min(r.width-tw-4,cx-tw/2)))+'px';tip.style.top=Math.round(top)+'px';
 }

 const mouseHide=e=>{if(e.pointerType==='mouse')hide();};
 $$('.data-mark',wrap).forEach((p,i)=>{p.addEventListener('pointerenter',()=>show(i));p.addEventListener('pointerleave',mouseHide);p.addEventListener('focus',()=>show(i));p.addEventListener('blur',hide);p.addEventListener('click',()=>show(i));p.addEventListener('keydown',e=>{if(e.key==='Escape'){hide();return;}if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i);return;}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();$$('.data-mark',wrap)[Math.max(0,Math.min(data.length-1,i+(e.key==='ArrowRight'?1:-1)))].focus();}});});
 if(spec.type!=='donut'){
  wrap.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||wrap.hasPointerCapture(e.pointerId))return;show(nearest(e.clientX));});
  wrap.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')show(nearest(e.clientX));});
 }
 wrap.addEventListener('pointerleave',mouseHide);
 if(expanded&&spec.type!=='donut'){let drag=null;wrap.addEventListener('pointerdown',e=>{if(e.button!==0||zoom===1)return;drag={x:e.clientX,pan};wrap.setPointerCapture(e.pointerId);});wrap.addEventListener('pointerup',e=>{if(!drag)return;pan=Math.max(0,Math.min(pw*(zoom-1),drag.pan+(drag.x-e.clientX)*W/svg.getBoundingClientRect().width));drag=null;wrap.releasePointerCapture(e.pointerId);renderExpanded();});wrap.addEventListener('pointercancel',()=>drag=null);}
}

// Restore material darkening inside each panel. Near edges, the radius closes
// continuously before crossing the border instead of clipping a large circle.
const panelLights=$$('.sidebar, .chat-scroll, .composer').map(el=>({el,x:0,y:0,r:0,a:0,tx:0,ty:0,tr:0,ta:0,active:false}));
let lightFrame=0;
function animateGlass(){
 let moving=false;
 for(const state of panelLights){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ease=reduce?1:.13;
  for(const [key,target] of [['x','tx'],['y','ty'],['r','tr'],['a','ta']]){state[key]+=(state[target]-state[key])*ease;if(Math.abs(state[target]-state[key])>.05)moving=true;}
  state.el.style.setProperty('--light-x',state.x+'px');state.el.style.setProperty('--light-y',state.y+'px');state.el.style.setProperty('--light-radius',Math.max(0,state.r)+'px');state.el.style.setProperty('--light-alpha',Math.max(0,state.a).toFixed(3));
 }
 lightFrame=moving?requestAnimationFrame(animateGlass):0;
}
function wakeGlass(){if(!lightFrame)lightFrame=requestAnimationFrame(animateGlass);}
for(const state of panelLights){
 state.el.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  const rect=state.el.getBoundingClientRect();state.tx=e.clientX-rect.left;state.ty=e.clientY-rect.top;
  if(!state.active){state.x=state.tx;state.y=state.ty;state.active=true;}
  const edge=Math.max(0,Math.min(state.tx,rect.width-state.tx,state.ty,rect.height-state.ty));
  state.tr=Math.min(155,edge*1.25);state.ta=.58*Math.min(1,edge/28);wakeGlass();
 });
 state.el.addEventListener('pointerleave',()=>{state.active=false;state.tr=0;state.ta=0;wakeGlass();});
}
window.addEventListener('blur',()=>{panelLights.forEach(s=>{s.tr=0;s.ta=0;s.active=false;});wakeGlass();});

// Attachment payloads live in IndexedDB (too large for localStorage); a memory copy covers private windows.
const fileDB=(()=>{let opening=null;const mem=new Map();
 function db(){if(!opening)opening=new Promise((res,rej)=>{const r=indexedDB.open('repsns-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}).catch(()=>null);return opening;}
 async function run(mode,fn){const d=await db();if(!d)return null;return new Promise((res,rej)=>{const t=d.transaction('files',mode),req=fn(t.objectStore('files'));t.oncomplete=()=>res(req.result);t.onerror=()=>rej(t.error);});}
 return {
  async put(id,rec){mem.set(id,rec);try{await run('readwrite',s=>s.put(rec,id));}catch{}},
  async get(id){if(mem.has(id))return mem.get(id);try{const rec=await run('readonly',s=>s.get(id));if(rec)mem.set(id,rec);return rec||null;}catch{return null;}},
  async del(id){mem.delete(id);try{await run('readwrite',s=>s.delete(id));}catch{}}
 };})();
function purgeFiles(chat){chat.messages.forEach(m=>m.files?.forEach(f=>fileDB.del(f.id)));}

// ---------- small shared UI: popover menu, undo toast, inline rename
const menuEl=document.createElement('div');menuEl.className='pop-menu';menuEl.setAttribute('role','menu');menuEl.hidden=true;document.body.append(menuEl);let menuOwner=null;
function openMenu(anchor,items){
 if(menuOwner===anchor&&!menuEl.hidden){closeMenu();return;}
 closeMenu(false);menuEl.replaceChildren();
 for(const it of items){
  if(it.heading){const h=document.createElement('div');h.className='pop-heading';h.textContent=it.heading;menuEl.append(h);continue;}
  const b=document.createElement('button');b.type='button';b.setAttribute('role','menuitem');b.className='pop-item'+(it.danger?' danger':'')+(it.current?' current':'');b.textContent=it.label;
  if(it.action)b.dataset.action=it.action;if(it.disabled)b.disabled=true;
  b.addEventListener('click',()=>{closeMenu(false);it.run?.();});menuEl.append(b);
 }
 menuEl.hidden=false;menuOwner=anchor;anchor.setAttribute('aria-expanded','true');
 const r=anchor.getBoundingClientRect(),mw=menuEl.offsetWidth,mh=menuEl.offsetHeight;
 let top=r.bottom+6;if(top+mh>innerHeight-8)top=Math.max(8,r.top-mh-6);
 menuEl.style.left=Math.round(Math.min(innerWidth-mw-8,Math.max(8,r.left)))+'px';menuEl.style.top=Math.round(top)+'px';
 $('.pop-item:not(:disabled)',menuEl)?.focus();
}
function closeMenu(refocus=true){if(menuEl.hidden)return;menuEl.hidden=true;const owner=menuOwner;menuOwner=null;owner?.setAttribute('aria-expanded','false');if(refocus&&owner?.isConnected)owner.focus();}
document.addEventListener('pointerdown',e=>{if(!menuEl.hidden&&!menuEl.contains(e.target)&&!menuOwner?.contains(e.target))closeMenu(false);});
menuEl.addEventListener('keydown',e=>{const items=$$('.pop-item:not(:disabled)',menuEl),i=items.indexOf(document.activeElement);
 if(e.key==='Escape'){e.preventDefault();closeMenu();}
 else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus();}
 else if(e.key==='Tab')closeMenu(false);});
window.addEventListener('resize',()=>closeMenu(false));
function offerUndo(msg,undo,commit){finishUndo();const st={undo,commit};pendingUndo=st;
 toast(msg,{label:'Undo',run:()=>{if(pendingUndo!==st)return;pendingUndo=null;clearTimeout(st.timer);st.undo();toast('Restored');}});
 st.timer=setTimeout(()=>{if(pendingUndo===st)finishUndo();},7000);}
function finishUndo(){const st=pendingUndo;pendingUndo=null;if(st){clearTimeout(st.timer);st.commit?.();}}
addEventListener('pagehide',finishUndo);
function inlineEdit(target,initial,commit){
 const inp=document.createElement('input');inp.className='inline-edit';inp.value=initial;inp.maxLength=60;inp.setAttribute('aria-label','New name');
 target.replaceWith(inp);inp.focus();inp.select();let done=false;
 const finish=save=>{if(done)return;done=true;const v=inp.value.trim();commit(save&&v?v:null);};
 inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();finish(true);}else if(e.key==='Escape'){e.preventDefault();finish(false);}});
 inp.addEventListener('blur',()=>finish(true));
}

async function copyText(text){try{await navigator.clipboard.writeText(text);}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();document.execCommand('copy');t.remove();}toast('Copied');}
function addRetry(row){$('.message-body',row).insertAdjacentHTML('beforeend','<div class="msg-actions"><button type="button" class="msg-action" data-msg-action="retry">Retry</button></div>');}
messages.addEventListener('click',e=>{
 const fb=e.target.closest('[data-file]');if(fb){openFile({id:fb.dataset.file,cat:fb.dataset.cat,name:fb.dataset.name});return;}
 const a=e.target.closest('[data-msg-action]');if(!a)return;const row=a.closest('.message'),act=a.dataset.msgAction;
 if(act==='copy')copyText(row.dataset.text||'');
 else if(busy)return;
 else if(act==='regenerate'){const c=activeChat();if(!c)return;if(c.messages.at(-1)?.role==='assistant'){c.messages.pop();saveStore();}row.remove();requestReply();}
 else if(act==='retry'){row.remove();requestReply();}
});
async function openFile(f){
 const rec=await fileDB.get(f.id);if(!rec){toast('This file is no longer stored in this browser');return;}
 const dlg=$('#info-dialog');
 if(f.cat==='image'&&/^image\/(png|jpeg|webp|gif)$/.test(rec.media)){showInfo(f.name,'<img class="file-preview" alt="">');const img=$('#info-content .file-preview');img.src=`data:${rec.media};base64,${rec.data}`;img.alt=f.name;dlg.classList.add('wide');}
 else if(f.cat==='text'){showInfo(f.name,'<pre class="file-text"></pre>');$('#info-content .file-text').textContent=rec.data.slice(0,30000);dlg.classList.add('wide');}
 else if(f.cat==='pdf'){const bytes=Uint8Array.from(atob(rec.data),ch=>ch.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000);}
}
$('#info-dialog').addEventListener('close',()=>$('#info-dialog').classList.remove('wide'));

// ---------- attaching files: + menu, drag and drop, paste
const MAX_FILES=5,IMG_EDGE=1568;
const fileInput=document.createElement('input');fileInput.type='file';fileInput.multiple=true;fileInput.hidden=true;
fileInput.accept='image/png,image/jpeg,image/webp,image/gif,application/pdf,.pdf,.txt,.md,.markdown,.csv,text/plain,text/markdown,text/csv';
document.body.append(fileInput);fileInput.addEventListener('change',()=>{addFiles([...fileInput.files]);fileInput.value='';});
$('.attach').addEventListener('click',e=>openMenu(e.currentTarget,[{label:'Upload images or workout plans…',run:()=>fileInput.click()},{label:'View sample sessions',action:'sample'}]));
function fmtSize(n){return n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';}
function fileCategory(f){const n=f.name.toLowerCase();if(/^image\/(png|jpeg|webp|gif)$/.test(f.type))return 'image';if(f.type==='application/pdf'||n.endsWith('.pdf'))return 'pdf';if(/^text\//.test(f.type)||/\.(txt|md|markdown|csv)$/.test(n))return 'text';return null;}
const readAs=(f,how)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r[how](f);});
function drawScaled(bmp,maxEdge,mime,quality,bg){const s=Math.min(1,maxEdge/Math.max(bmp.width,bmp.height)),w=Math.max(1,Math.round(bmp.width*s)),h=Math.max(1,Math.round(bmp.height*s));
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');if(bg){g.fillStyle=bg;g.fillRect(0,0,w,h);}g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(bmp,0,0,w,h);return c.toDataURL(mime,quality);}
async function intakeImage(f){
 const bmp=await createImageBitmap(f);let url;
 if(Math.max(bmp.width,bmp.height)<=IMG_EDGE&&f.size<=3.5*1048576)url=await readAs(f,'readAsDataURL');
 else{url=drawScaled(bmp,IMG_EDGE,f.type==='image/png'?'image/png':'image/jpeg',.9,f.type==='image/png'?null:'#fff');if(url.length*.75>4.5*1048576)url=drawScaled(bmp,IMG_EDGE,'image/jpeg',.86,'#fff');}
 const thumb=drawScaled(bmp,360,'image/jpeg',.88,'#fff');bmp.close?.();
 return {media:url.slice(5,url.indexOf(';')),data:url.slice(url.indexOf(',')+1),thumb};
}
async function addFiles(list){
 for(const f of list){
  if(pending.length>=MAX_FILES){toast(`Up to ${MAX_FILES} files per message`);break;}
  const cat=fileCategory(f);if(!cat){toast(`${f.name}: attach an image, a PDF, or a .txt, .md or .csv file`);continue;}
  try{
   let rec;
   if(cat==='image'){if(f.size>30*1048576)throw new Error('images must be under 30 MB');rec=await intakeImage(f);}
   else if(cat==='pdf'){if(f.size>10*1048576)throw new Error('PDFs must be under 10 MB');const u=await readAs(f,'readAsDataURL');rec={media:'application/pdf',data:u.slice(u.indexOf(',')+1)};}
   else{const t=await readAs(f,'readAsText');if(!t.trim())throw new Error('the file is empty');if(t.length>150000)throw new Error('text files must be under 150,000 characters');rec={media:'text/plain',data:t};}
   const id=uid();await fileDB.put(id,{media:rec.media,data:rec.data});
   pending.push({id,name:(f.name||'file').slice(0,120),size:f.size,cat,thumb:rec.thumb||null});
  }catch(err){toast(`${f.name}: ${err?.message||'could not be read'}`);}
 }
 renderTray();
}
const fileBadge=cat=>cat==='pdf'?'PDF':'TXT';
function renderTray(){
 const tray=$('#attach-tray');tray.hidden=!pending.length;tray.replaceChildren();if(!pending.length)return;
 const wrap=document.createElement('div');wrap.className='tray-files';
 for(const f of pending){const item=document.createElement('div');item.className='tray-item';
  item.innerHTML=`${f.cat==='image'?'<img alt="">':`<span class="file-icon">${fileBadge(f.cat)}</span>`}<span class="tray-name"></span><span class="file-size">${fmtSize(f.size)}</span><button type="button" class="tray-remove" aria-label="">✕</button>`;
  if(f.thumb)$('img',item).src=f.thumb;$('.tray-name',item).textContent=f.name;const rm=$('.tray-remove',item);rm.setAttribute('aria-label',`Remove ${f.name}`);
  rm.addEventListener('click',()=>{pending=pending.filter(x=>x!==f);fileDB.del(f.id);renderTray();input.focus();});wrap.append(item);}
 const note=document.createElement('p');note.className='tray-note';note.textContent='Files are sent to Anthropic for analysis. Use fictional or non-identifying files.';
 tray.append(wrap,note);
}
const mainEl=$('.main');let fileDrag=0;
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
mainEl.addEventListener('dragenter',e=>{if(!hasFiles(e))return;fileDrag++;mainEl.classList.add('file-drag');});
mainEl.addEventListener('dragleave',e=>{if(!hasFiles(e))return;if(--fileDrag<=0){fileDrag=0;mainEl.classList.remove('file-drag');}});
mainEl.addEventListener('dragover',e=>{if(hasFiles(e)){e.preventDefault();e.dataTransfer.dropEffect='copy';}});
mainEl.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();fileDrag=0;mainEl.classList.remove('file-drag');addFiles([...e.dataTransfer.files]);});
input.addEventListener('paste',e=>{const files=[...(e.clipboardData?.files||[])];if(files.length){e.preventDefault();addFiles(files);}});

// ---------- sending: history with attachments (newest files first within the budget)
const MAX_SEND_FILES=8,MAX_SEND_CHARS=20e6;
async function buildHistory(chat){
 const msgs=chat.messages.slice(-16);while(msgs[0]?.role==='assistant')msgs.shift();
 let files=MAX_SEND_FILES,chars=MAX_SEND_CHARS;const out=new Array(msgs.length);
 for(let i=msgs.length-1;i>=0;i--){const m=msgs[i];
  if(m.role!=='user'||!m.files?.length){out[i]={role:m.role==='user'?'user':'assistant',content:m.text.slice(0,20000)};continue;}
  const blocks=[];
  for(const f of m.files){const rec=files>0?await fileDB.get(f.id):null;
   if(rec&&rec.data.length<=chars){files--;chars-=rec.data.length;
    if(f.cat==='image')blocks.push({type:'image',source:{type:'base64',media_type:rec.media,data:rec.data}});
    else if(f.cat==='pdf')blocks.push({type:'document',title:f.name,source:{type:'base64',media_type:'application/pdf',data:rec.data}});
    else blocks.push({type:'document',title:f.name,source:{type:'text',media_type:'text/plain',data:rec.data}});}
   else blocks.push({type:'text',text:`[Attachment not included: ${f.name}${rec?' (over the size limit for one request)':' (no longer available)'}]`});}
  blocks.push({type:'text',text:m.text.slice(0,20000)});out[i]={role:'user',content:blocks};}
 return out;
}
document.addEventListener('click',e=>{if(!e.target.closest('[data-action="clear-all"]'))return;
 if(!confirm('Delete all chats, projects and attached files in this browser? The three sample chats will be restored.'))return;
 finishUndo();store.chats.forEach(purgeFiles);pending.forEach(f=>fileDB.del(f.id));pending=[];renderTray();store=seedStore();saveStore();$('#info-dialog').close();openChat(store.activeId);toast('All chats reset');});


/* ---------- Workout plans (shared with the Master plan page) ---------- */
function setPlans(list){
 const focusedStar=document.activeElement?.closest('.master-star');
 const focusedCard=focusedStar?.closest('.program-card');
 plans=list||[];
 renderSidebar();
 if($('.welcome'))setIdeas(welcomeIdeas());
 for(const card of $$('.program-card[data-program]')){
  const updated=programCard(card.dataset.program);
  card.replaceWith(updated);
  if(card===focusedCard)$('.master-star',updated)?.focus({preventScroll:true});
 }
 if(focusedStar&&!focusedCard)$(`.plan-row [data-master-plan="${CSS.escape(focusedStar.dataset.masterPlan)}"]`)?.focus({preventScroll:true});
}
async function planAction(body){
 try{const r=await fetch('/api/programs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not update the plan');setPlans(d.programs);return d;}
 catch(e){toast(e.message);}
}
function masterStar(plan){
 const button=document.createElement('button');
 button.type='button';
 button.className='master-star';
 button.dataset.masterPlan=plan.id;
 button.title=plan.is_master?'Current master plan':'Make this the master plan';
 button.setAttribute('aria-label',`Master plan for ${plan.name}`);
 button.setAttribute('aria-pressed',String(plan.is_master));
 const icon=document.createElement('span');
 icon.setAttribute('aria-hidden','true');
 icon.textContent=plan.is_master?'★':'☆';
 button.append(icon);
 button.addEventListener('click',()=>makeMaster(plan.id));
 return button;
}
let changingMaster=false;
async function makeMaster(id){
 if(changingMaster||plans.find(plan=>plan.id===id)?.is_master)return;
 changingMaster=true;
 try{
  const result=await planAction({action:'master',id});
  if(result)toast(`“${result.item.name}” is now your master plan`);
 }finally{changingMaster=false;}
}
function plansSection(q){
 const sec=document.createElement('section');sec.className='side-section';
 sec.innerHTML='<div class="side-heading"><span>Workout plans</span><a class="side-add icon-button" href="/#new" aria-label="Build a new plan" title="Build a new plan" style="display:grid;place-items:center;text-decoration:none">+</a></div>';
 const list=[...plans].sort((a,b)=>b.is_master-a.is_master||(b.updated||'').localeCompare(a.updated||'')).filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase()));
 for(const p of list){
  const row=document.createElement('div');row.className='plan-row';
  row.innerHTML=`<a class="plan-item" href="/#program=${encodeURIComponent(p.id)}"><span class="history-title"></span></a><button type="button" class="plan-menu icon-button" aria-haspopup="menu" aria-expanded="false">⋯</button>`;
  $('.history-title',row).textContent=p.name;$('.plan-menu',row).setAttribute('aria-label',`Options for plan ${p.name}`);
  row.insertBefore(masterStar(p),$('.plan-menu',row));
  $('.plan-menu',row).addEventListener('click',e=>{e.stopPropagation();planMenu(p,e.currentTarget);});
  sec.append(row);
 }
 if(!list.length)sec.insertAdjacentHTML('beforeend',`<p class="side-empty">${q?'No matching plans.':'No saved plans yet. Build one, or ask me to create one.'}</p>`);
 return sec;
}
function planMenu(p,anchor){
 openMenu(anchor,[
  {label:'Open in Master plan',run:()=>{location.href=`/#program=${p.id}`;}},
  {label:'Show in chat',run:()=>{const c=ensureChat(`Plan: ${p.name}`);$('.welcome')?.remove();addMessage('assistant',`Here is “${p.name}”${p.is_master?', your master plan':''}.`,`program:${p.id}`);setIdeas([['Change it','Make a change to '+p.name],['Explain it','Explain the VL targets in '+p.name]]);scrollBottom();}},
  {label:'Ask about this plan',run:()=>{input.value=`About “${p.name}”: `;input.focus();}},
  {label:'★ Make master plan',disabled:p.is_master,run:()=>makeMaster(p.id)},
  {label:'Rename',run:()=>{const n=prompt('New name for this plan:',p.name);if(n&&n.trim())planAction({action:'rename',id:p.id,name:n});}},
  {label:'Delete plan',danger:true,run:()=>{if(confirm(`Delete “${p.name}”? This can’t be undone.`))planAction({action:'delete',id:p.id}).then(d=>d&&toast(`Deleted “${p.name}”`));}}
 ]);
}
const fmtRest=s=>s>=60?(s%60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} min`:`${s/60} min`):`${s} s`;
function programCard(id){
 const card=document.createElement('section');card.className='program-card';card.dataset.program=id;
 const item=plans.find(p=>p.id===id);
 if(!item){card.innerHTML='<p class="pc-sub">'+(plansLoaded?'This plan has been deleted.':'Loading plan…')+'</p>';return card;}
 const pr=item.program;
 card.innerHTML=`<div class="pc-head"><div class="pc-title"><div><h2></h2><div class="pc-sub"></div></div></div><div class="pc-actions"><a class="primary" href="/#program=${encodeURIComponent(id)}">Open in Master plan</a></div></div>`+
  pr.days.map(d=>`<div class="pc-day"><h3>${escapeHTML(d.name)} <span>· ${escapeHTML(d.focus)} · ~${Number(d.estimated_minutes)||'?'} min</span></h3><div class="pc-scroll"><table><thead><tr><th>Exercise</th><th>Warm-up</th><th>Sets × reps</th><th>Stop at VL</th><th>Rest</th></tr></thead><tbody>${d.exercises.map(x=>`<tr><td>${escapeHTML(x.name)}</td><td>${escapeHTML(x.warmup_sets)}</td><td>${Number(x.working_sets)} × ${escapeHTML(x.rep_range)}</td><td>${x.target_vl_percent>0?`<span class="vl">${Number(x.target_vl_percent)}%</span>`:'<span class="vl none">none</span>'}</td><td>${fmtRest(Number(x.rest_seconds))}</td></tr>`).join('')}</tbody></table></div></div>`).join('');
 $('h2',card).textContent=item.name;
 $('.pc-title',card).prepend(masterStar(item));
 if(item.is_master)$('h2',card).insertAdjacentHTML('beforeend','<span class="pc-badge">Master plan</span>');
 $('.pc-sub',card).textContent=`${pr.title} · ${pr.days.length} days · not medical advice`;
 return card;
}
const plansReady=(location.protocol==='file:'?Promise.resolve([]):fetch('/api/programs').then(r=>r.ok?r.json():{programs:[]}).then(d=>d.programs||[]).catch(()=>[])).then(list=>{plansLoaded=true;setPlans(list);return list;});

// Arriving from the Master plan page after saving: open a chat about that plan.
const savedParam=new URLSearchParams(location.search).get('saved');
if(savedParam){
 history.replaceState(null,'',location.pathname);
 plansReady.then(list=>{
  const p=list.find(x=>x.id===savedParam);if(!p){if(activeChat())openChat(store.activeId);else newChat();return;}
  const c={id:uid(),title:`Plan: ${p.name}`,projectId:null,pinned:false,updated:Date.now(),messages:[{role:'assistant',text:`Saved “${p.name}”${p.is_master?' as your master plan':''}. I can see it now.\n\nAsk me anything about it, or tell me what to change: swap an exercise, shorten a session, make a lighter copy, rename it, or explain the VL targets.`,kind:`program:${p.id}`}]};
  store.chats.push(c);saveStore();openChat(c.id);
  setIdeas([['Swap an exercise','Swap an exercise in my master plan that I don\'t like'],['Shorter sessions','Make my sessions 15 minutes shorter'],['Explain VL','Why do some exercises stop at 60% VL and others at 40%?'],['Lighter copy','Make a lighter copy of my plan for travel weeks']]);
 });
}else if(activeChat())openChat(store.activeId);else newChat();
moveChatMarker(false);


// A moving reflection, masked to the logo rather than lighting the background.
const logoSurface=$('.logo-reflection');
const logoGradient=$('#logo-light');
const logoShine={x:40,y:36,tx:40,ty:36,opacity:0,target:0};
let logoFrame=0;
function animateLogoReflection(){
 const ease=matchMedia('(prefers-reduced-motion: reduce)').matches?1:.12;
 logoShine.x+=(logoShine.tx-logoShine.x)*ease;
 logoShine.y+=(logoShine.ty-logoShine.y)*ease;
 logoShine.opacity+=(logoShine.target-logoShine.opacity)*ease;
 logoGradient.setAttribute('cx',logoShine.x.toFixed(2));
 logoGradient.setAttribute('cy',logoShine.y.toFixed(2));
 logoSurface.style.opacity=logoShine.opacity.toFixed(3);
 const unsettled=Math.abs(logoShine.tx-logoShine.x)>.02||Math.abs(logoShine.ty-logoShine.y)>.02||Math.abs(logoShine.target-logoShine.opacity)>.002;
 logoFrame=unsettled?requestAnimationFrame(animateLogoReflection):0;
}
function wakeLogo(){if(!logoFrame)logoFrame=requestAnimationFrame(animateLogoReflection);}
document.addEventListener('pointermove',event=>{
 if(event.pointerType!=='mouse')return;
 const rect=logoSurface.getBoundingClientRect();
 const scale=Math.min(rect.width/80,rect.height/72);
 if(scale<=0)return;
 const left=rect.left+(rect.width-80*scale)/2;
 const top=rect.top+(rect.height-72*scale)/2;
 logoShine.tx=(event.clientX-left)/scale;
 logoShine.ty=(event.clientY-top)/scale;
 const outside=Math.hypot(Math.max(0,left-event.clientX,event.clientX-left-80*scale),Math.max(0,top-event.clientY,event.clientY-top-72*scale));
 logoShine.target=.64*Math.max(0,1-outside/85);
 wakeLogo();
},{passive:true});
function fadeLogo(){logoShine.target=0;wakeLogo();}
document.documentElement.addEventListener('pointerleave',fadeLogo);
window.addEventListener('blur',fadeLogo);

});</script>
